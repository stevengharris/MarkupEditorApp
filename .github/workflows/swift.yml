name: MarkupEditorApp

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'

    # markupeditor-app/dist/markupeditor-app.js is gitignored and has no
    # checked-in fallback (unlike the plugins' dist/*.js, which ARE
    # committed) -- Xcode's own "Build npm projects" script phase would
    # normally produce it, but that phase is
    # runOnlyForDeploymentPostprocessing = 1, so it never runs for
    # `xcodebuild build`/`test`, only `archive`. Without this step the file
    # is silently absent from the test build (no build error), and a real
    # MarkupWKWebView loaded against the missing userScript hangs rather
    # than failing -- confirmed by reproducing the exact same App Sandbox
    # restriction cascade seen in CI logs (pasteboard/RunningBoard/
    # AudioComponentRegistrar denials) in an isolated local worktree with
    # this file missing, and the hang disappearing once it's present.
    - name: Build markupeditor-app.js
      run: |
        npm ci
        cd markupeditor-app && npm run build

    - name: Install certificate
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.MAC_BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        # Decode certificate to temp file
        CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
        KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain

        echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

        # Create a temporary keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # Import certificate into the keychain
        security import $CERTIFICATE_PATH -P "$P12_PASSWORD" \
          -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

        # Allow codesign to access the keychain without UI prompts
        security set-key-partition-list \
          -S apple-tool:,apple:,codesign: \
          -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # Make it available to the build tools
        security list-keychain -d user -s $KEYCHAIN_PATH

    - name: Test MarkupEditorApp
      run: |
        xcodebuild clean test \
          -scheme MarkupEditorApp \
          -destination 'platform=macOS,arch=arm64' \
          -parallel-testing-enabled NO \
          OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/build.keychain"

    - name: Clean up keychain
      if: always()
      run: |
        security delete-keychain $RUNNER_TEMP/build.keychain

    # A separate local Swift package (its own Package.swift, own test
    # target) -- xcodebuild's MarkupEditorApp scheme above only runs
    # MarkupEditorAppTests, never MarkupEditorAppLibTests. Plain `swift
    # test`, no code-signing setup: unlike the App Sandbox-entitled app
    # target above, this package carries no entitlements for Gatekeeper to
    # enforce against an unsigned test binary.
    - name: Test MarkupEditorAppLib
      working-directory: MarkupEditorAppLib
      run: swift test
