name: MarkupEditorApp

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6

    # A suite that constructs a real MarkupWKWebView hangs rather than fails
    # on this runner (see the comment on the skip-testing flags below) --
    # this catches a NEW one in seconds, before the slow, hang-prone test
    # step below ever runs it. KNOWN_HAZARDS must match the
    # -skip-testing: entries there exactly (by file, not suite name).
    - name: Check for a new, un-skipped MarkupWKWebView construction
      run: |
        KNOWN_HAZARDS="MarkupEditorAppTests/MarkupWKWebViewHeadlessTests.swift
        MarkupEditorAppTests/SourceToggleIntegrationTests.swift"
        FOUND=$(grep -rl "MarkupWKWebView(" MarkupEditorAppTests MarkupEditorAppLib/Tests 2>/dev/null || true)
        STATUS=0
        for f in $FOUND; do
          if ! grep -qxF "$f" <<< "$KNOWN_HAZARDS"; then
            echo "::error file=$f::Constructs a real MarkupWKWebView, which hangs (App Sandbox restrictions) rather than fails on this runner's WebContent process. Add its suite to -skip-testing: in the 'Test MarkupEditorApp' step and to KNOWN_HAZARDS here, or -- if you've confirmed it actually passes -- leave it out of both."
            STATUS=1
          fi
        done
        exit $STATUS

    - name: Install certificate
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.MAC_BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        # Decode certificate to temp file
        CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
        KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain

        echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

        # Create a temporary keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # Import certificate into the keychain
        security import $CERTIFICATE_PATH -P "$P12_PASSWORD" \
          -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

        # Allow codesign to access the keychain without UI prompts
        security set-key-partition-list \
          -S apple-tool:,apple:,codesign: \
          -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # Make it available to the build tools
        security list-keychain -d user -s $KEYCHAIN_PATH

    # A suite that constructs a real MarkupWKWebView hangs rather than fails
    # on this runner: its WebContent process can't reach the pasteboard
    # server, RunningBoard, or AudioComponentRegistrar (App Sandbox
    # restrictions), and whatever "ready" callback the test awaits never
    # fires. Confirmed twice -- MarkupWKWebViewHeadlessTests, then
    # SourceToggleIntegrationTests -- each sitting for ~15 minutes with
    # nothing but sandbox-restriction log lines. `grep -rn "MarkupWKWebView("
    # MarkupEditorAppTests MarkupEditorAppLib/Tests` finds these two and only
    # these two across the whole test surface -- a real NSWindow/NSApp alone
    # (no webview) is NOT the hazard: HostedTextEditorSelectionTests
    # (SourceSelectionSpikeTests.swift) does exactly that and passes.
    # timeout-minutes above is the backstop if this ever misses one.
    - name: Test MarkupEditorApp
      run: |
        xcodebuild clean test \
          -scheme MarkupEditorApp \
          -destination 'platform=macOS,arch=arm64' \
          -parallel-testing-enabled NO \
          -skip-testing:MarkupEditorAppTests/MarkupWKWebViewHeadlessTests \
          -skip-testing:MarkupEditorAppTests/SourceToggleIntegrationTests \
          OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/build.keychain"

    - name: Clean up keychain
      if: always()
      run: |
        security delete-keychain $RUNNER_TEMP/build.keychain

    # A separate local Swift package (its own Package.swift, own test
    # target) -- xcodebuild's MarkupEditorApp scheme above only runs
    # MarkupEditorAppTests, never MarkupEditorAppLibTests. Plain `swift
    # test`, no code-signing setup: unlike the App Sandbox-entitled app
    # target above, this package carries no entitlements for Gatekeeper to
    # enforce against an unsigned test binary.
    - name: Test MarkupEditorAppLib
      working-directory: MarkupEditorAppLib
      run: swift test
