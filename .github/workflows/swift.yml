name: MarkupEditorApp

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6

    - name: Install certificate
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.MAC_BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        # Decode certificate to temp file
        CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
        KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain

        echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

        # Create a temporary keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # Import certificate into the keychain
        security import $CERTIFICATE_PATH -P "$P12_PASSWORD" \
          -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

        # Allow codesign to access the keychain without UI prompts
        security set-key-partition-list \
          -S apple-tool:,apple:,codesign: \
          -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # Make it available to the build tools
        security list-keychain -d user -s $KEYCHAIN_PATH

    # MarkupWKWebViewHeadlessTests and SourceSelectionSpikeTests need a real
    # interactive macOS session (a WKWebView content process reaching the
    # pasteboard server, RunningBoard, AudioComponentRegistrar; a real NSApp
    # for window/first-responder state) that this runner's App Sandbox
    # doesn't provide -- confirmed by a run that hung ~15 minutes with
    # nothing but sandbox-restriction log lines once MarkupWKWebViewHeadlessTests
    # started, never reaching the webview's "ready" callback. Skipped here
    # rather than chased further; timeout-minutes above is the backstop for
    # any other future hang.
    - name: Test MarkupEditorApp
      run: |
        xcodebuild clean test \
          -scheme MarkupEditorApp \
          -destination 'platform=macOS,arch=arm64' \
          -parallel-testing-enabled NO \
          -skip-testing:MarkupEditorAppTests/MarkupWKWebViewHeadlessTests \
          -skip-testing:MarkupEditorAppTests/SourceSelectionSpikeTests \
          OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/build.keychain"

    - name: Clean up keychain
      if: always()
      run: |
        security delete-keychain $RUNNER_TEMP/build.keychain

    # A separate local Swift package (its own Package.swift, own test
    # target) -- xcodebuild's MarkupEditorApp scheme above only runs
    # MarkupEditorAppTests, never MarkupEditorAppLibTests. Plain `swift
    # test`, no code-signing setup: unlike the App Sandbox-entitled app
    # target above, this package carries no entitlements for Gatekeeper to
    # enforce against an unsigned test binary.
    - name: Test MarkupEditorAppLib
      working-directory: MarkupEditorAppLib
      run: swift test
