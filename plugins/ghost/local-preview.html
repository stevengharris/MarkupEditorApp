<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>plugin-grid local preview</title>
</head>
<body>
<p>
  <button id="btn-happy">Happy path (real plugins.json)</button>
  <button id="btn-malformed">Malformed entry (fixture)</button>
  <button id="btn-fail">Fetch failure (404)</button>
</p>
<div id="preview-target"></div>
<script type="module">
  import { fetchAndRender } from './plugin-grid.js';

  const target = document.getElementById('preview-target');

  document.getElementById('btn-happy').addEventListener('click', () => {
    fetchAndRender('../plugins.json', target);
  });
  document.getElementById('btn-malformed').addEventListener('click', () => {
    fetchAndRender('./fixtures/malformed-entry.json', target);
  });
  document.getElementById('btn-fail').addEventListener('click', () => {
    fetchAndRender('./does-not-exist.json', target);
  });
</script>
</body>
</html>
